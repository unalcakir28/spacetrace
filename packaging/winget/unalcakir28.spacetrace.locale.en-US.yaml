ShortDescription: Scan a disk, snapshot it, and find out what grew
Description: |-
  spacetrace scans a directory tree, stores the result as a snapshot, and
  compares two snapshots to answer the question a one-off disk usage tool
  cannot: which folder grew, and by how much.

  It ships two binaries. spacetrace is the command-line tool. spacetrace-agent
  is a scheduler and HTTP service for a server, so a machine you do not sit at
  can be scanned on a timetable and read remotely.
