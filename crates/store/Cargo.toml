[package]
name = "spacetrace-store"
description = "SQLite snapshot store and ncdu-compatible export for spacetrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spacetrace-scan-core.workspace = true
spacetrace-dupes.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Already in the workspace for `spacetrace update`'s download check; reused
# here so a snapshot carries a digest without a second hash implementation.
sha2.workspace = true
gethostname = "0.5"

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3"
