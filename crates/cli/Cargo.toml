[package]
name = "spacetrace-cli"
description = "spacetrace command line: scan disks, store snapshots, see what grew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spacetrace"
path = "src/main.rs"

[dependencies]
sha2.workspace = true
spacetrace-buildinfo.workspace = true
spacetrace-scan-core.workspace = true
spacetrace-store = { workspace = true, features = ["dupes"] }
spacetrace-dupes.workspace = true
spacetrace-diff.workspace = true
anyhow.workspace = true
clap.workspace = true
humansize.workspace = true
serde.workspace = true
serde_json.workspace = true
# Remote sources (phase 2): blocking, because the CLI has no async runtime and
# does not need one for a handful of sequential requests.
reqwest.workspace = true
toml.workspace = true
zstd.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# `spacetrace watch` talks to inotify itself on Linux (`src/watch/inotify.rs`):
# notify's inotify backend asks for IN_OPEN, so every directory read is an
# event. FSEvents and Windows go through notify.
[target.'cfg(not(target_os = "linux"))'.dependencies]
notify.workspace = true

[dev-dependencies]
# Not a new crate: the store builds it. The tests reach past the API with it
# to forge the snapshot a hostile sender would send.
rusqlite.workspace = true
