name: Pages

# The site in website/ is plain HTML with no build step, so this workflow only
# uploads it. It is deliberately separate from Release: a typo fix on the
# download page should not trigger a five-target binary build, and a binary
# build should not have to succeed before a documentation fix goes live.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: the half-published state is what visitors
# would be looking at.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on with Actions as the source, so the site needs no
          # click in the repository settings to go live the first time.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deploy
        uses: actions/deploy-pages@v4
