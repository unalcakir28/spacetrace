name: Pages

# The site is an Astro project in website/, so this workflow builds it and
# uploads the output. It is deliberately separate from Release: a typo fix on
# the download page should not trigger a five-target binary build, and a binary
# build should not have to succeed before a documentation fix goes live.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: the half-published state is what visitors
# would be looking at.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - run: yarn install --frozen-lockfile

      # `astro check` runs the TypeScript compiler over the .astro files and
      # the React island. The five translation dictionaries are typed against
      # the English one, so a key added in one language and forgotten in
      # another fails here rather than leaving a blank space on a live page.
      - run: yarn typecheck

      - run: yarn build

      # Runs the language redirector out of `dist/` in a stub browser and
      # checks where it sends each kind of reader. This exists because the
      # feature once shipped inert: an Astro templating mistake emitted a
      # script that parsed, contained `window.location.replace`, and did
      # nothing at all. The build was green and the HTML looked right, so only
      # executing the built script catches it.
      - run: yarn verify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - id: deploy
        uses: actions/deploy-pages@v4
