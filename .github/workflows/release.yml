name: Release

# Two channels out of one pipeline.
#
#   push to main   -> the `continuous` pre-release, rebuilt and replaced in
#                     place, so "the latest build" always has a fixed URL
#   push of a v*   -> a normal, permanent release with generated notes
#
# The asset names carry the channel (`spacetrace-continuous-…`) rather than a
# commit, because install.sh builds the file name from the version it was given
# and the download page links to one URL that must not move.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A docs-only commit does not change a binary, and a five-target build is
    # not free.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "tasks/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build as, e.g. v0.1.0-test"
        required: true
      publish:
        description: >-
          Publish the result. Off by default, so a dispatch is a dry run.
          Turn it on to release a tag by hand — which is the way out if the
          paths-ignore filter above skipped a tag push.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      rolling: ${{ steps.pick.outputs.rolling }}
    steps:
      - id: pick
        # The dispatch input reaches the shell through the environment, never
        # interpolated into the script: it is attacker-controlled text.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG:-}" ]; then
            version="$INPUT_TAG"
            rolling=false
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            rolling=false
          else
            version=continuous
            rolling=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rolling=$rolling" >> "$GITHUB_OUTPUT"
          echo "Building as $version (rolling=$rolling)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl so the agent is a single static binary that runs on any glibc
          # version, including the elderly ones on NAS firmware.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tooling
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} \
              --bin spacetrace --bin spacetrace-agent
          else
            cargo build --release --target ${{ matrix.target }} \
              --bin spacetrace --bin spacetrace-agent
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          name="spacetrace-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/spacetrace.exe "dist/${name}/"
            cp target/${{ matrix.target }}/release/spacetrace-agent.exe "dist/${name}/"
          else
            cp target/${{ matrix.target }}/release/spacetrace "dist/${name}/"
            cp target/${{ matrix.target }}/release/spacetrace-agent "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}"
          else
            # Flat archive: install.sh expects the binaries at the top level.
            tar -czf "${name}.tar.gz" -C "${name}" .
          fi

      # The raw binaries as well as the archive: the container image copies them
      # straight in, and unpacking a tarball inside a Docker context to get two
      # files back out is work for nothing.
      - name: Stage the binaries for the image
        if: matrix.arch != ''
        shell: bash
        run: |
          mkdir -p image/bin/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/spacetrace \
             target/${{ matrix.target }}/release/spacetrace-agent \
             image/bin/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.arch != ''
        with:
          name: image-${{ matrix.arch }}
          # The directory, not a glob: with `image/**` the artifact's root
          # becomes image/bin/<arch> and the layout the Dockerfile copies from
          # is lost.
          path: image
          if-no-files-found: error

  publish:
    name: publish ${{ needs.meta.outputs.version }}
    needs: [meta, build]
    # A dispatch is a dry run unless it was asked to publish.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Release notes come from crates/changelog, so this job needs a compiler
      # even though it builds nothing else. The crate depends only on serde, so
      # it is seconds once the cache is warm.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: image
          pattern: image-*
          merge-multiple: true

      - name: Checksums
        # Regular files only, and never the sums file itself: `sha256sum ./*`
        # dies on the first directory it meets, which is how a stray folder in
        # an artifact takes the whole release down.
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the rolling build
        if: needs.meta.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Deleted and recreated rather than edited, so the tag follows main and
        # an asset dropped from the matrix cannot linger as a stale download.
        run: |
          cat > notes.md <<EOF
          Built from \`main\` at \`${GITHUB_SHA:0:7}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          This is the newest code, not a release: it has passed CI and nothing else.
          For something stable, use the latest \`v*\` release.

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | SPACETRACE_VERSION=continuous sh
          \`\`\`

          ## Landed since the last release
          EOF
          cargo run -q -p spacetrace-changelog -- unreleased --component cli >> notes.md
          gh release delete continuous --cleanup-tag --yes || true
          gh release create continuous artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Continuous build (main)" \
            --notes-file notes.md

      - name: Publish the release
        if: needs.meta.outputs.rolling == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        # The notes come from the changelog, not from `--generate-notes`: the
        # commit subjects are Turkish and describe the code, which is the wrong
        # text for a download page. This also refuses to publish a version the
        # changelog has never heard of — the release cannot get ahead of its
        # own notes.
        run: |
          cargo run -q -p spacetrace-changelog -- \
            notes --component cli --version "$VERSION" > notes.md
          cat >> notes.md <<EOF

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | SPACETRACE_VERSION=$VERSION sh
          \`\`\`
          EOF
          gh release create "$VERSION" artifacts/* \
            --title "spacetrace $VERSION" \
            --notes-file notes.md

      # The agent's container image, which docs/AGENT.md tells people to pull.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
          ROLLING: ${{ needs.meta.outputs.rolling }}
        run: |
          if [ "$ROLLING" = "true" ]; then
            echo "list=${IMAGE}:main,${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          else
            echo "list=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: image
          file: .github/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
