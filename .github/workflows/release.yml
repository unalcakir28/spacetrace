name: Release

# One channel: a `v*` tag, and nothing else.
#
# This used to build `main` on every push as well, into a rolling `continuous`
# pre-release. That channel is gone — 19 September 2026. It cost a five-target
# build per push for something the download page only ever fell back to, and
# the artifacts it left behind filled the account's Actions storage and took a
# real release down with it. A build now happens when a version is named.
#
# There is no `paths-ignore` either, and that is deliberate. It only ever ran
# on pushes, so with `main` gone its single remaining effect would be to skip a
# *tag* push whose commit happened to touch only documentation — silently
# publishing nothing. That was already the first trap in the release skill.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build as, e.g. v0.1.0-test"
        required: true
      publish:
        description: >-
          Publish the result. Off by default, so a dispatch is a dry run.
          Turn it on to release a tag by hand, or to build a version that is
          not a real tag at all.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        # The dispatch input reaches the shell through the environment, never
        # interpolated into the script: it is attacker-controlled text.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tagged=false
          if [ -n "${INPUT_TAG:-}" ]; then
            version="$INPUT_TAG"
          else
            version="$GITHUB_REF_NAME"
            tagged=true
          fi

          # A tag that disagrees with the manifest ships a binary that lies
          # about its own version: `v0.2.0` in the file name, `0.1.0` from
          # --version, and an update check that never stops offering an upgrade
          # the user already installed. Nothing caught this before.
          #
          # Real tag pushes only. A dispatch is someone typing a version on
          # purpose — often `v0.1.0-test`, which is supposed to disagree.
          if [ "$tagged" = true ]; then
            manifest=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            if [ "$version" != "v$manifest" ]; then
              echo "::error::tag $version does not match workspace.package.version $manifest in Cargo.toml"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building as $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl so the agent is a single static binary that runs on any glibc
          # version, including the elderly ones on NAS firmware.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tooling
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --locked

      - name: Build
        shell: bash
        # The build stamps these into the binary, so `--version` can say which
        # build it is rather than only which version number. Passed in rather
        # than read from `.git`: `cross` builds inside a container that has no
        # checkout, and a build script that shells out to git only reruns when
        # cargo thinks its inputs changed.
        #
        # --locked so a release resolves the dependency versions the lockfile
        # names. Without it two builds of one tag can differ, which makes the
        # commit stamped above a half-truth.
        env:
          SPACETRACE_GIT_SHA: ${{ github.sha }}
          SPACETRACE_CHANNEL: release
        run: |
          export SPACETRACE_BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} \
              --bin spacetrace --bin spacetrace-agent
          else
            cargo build --release --locked --target ${{ matrix.target }} \
              --bin spacetrace --bin spacetrace-agent
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          name="spacetrace-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/spacetrace.exe "dist/${name}/"
            cp target/${{ matrix.target }}/release/spacetrace-agent.exe "dist/${name}/"
          else
            cp target/${{ matrix.target }}/release/spacetrace "dist/${name}/"
            cp target/${{ matrix.target }}/release/spacetrace-agent "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}"
          else
            # Flat archive: install.sh expects the binaries at the top level.
            tar -czf "${name}.tar.gz" -C "${name}" .
          fi

      # The raw binaries as well as the archive: the container image copies them
      # straight in, and unpacking a tarball inside a Docker context to get two
      # files back out is work for nothing.
      - name: Stage the binaries for the image
        if: matrix.arch != ''
        shell: bash
        run: |
          mkdir -p image/bin/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/spacetrace \
             target/${{ matrix.target }}/release/spacetrace-agent \
             image/bin/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          # One day, not the 90-day default. This only has to survive until
          # `publish` downloads it later in the same run; the durable copies
          # are the release assets. At the default, this workflow's output
          # from every push sat for three months — the desktop repo's did
          # exactly that until it filled the account's 0.5 GB Actions storage
          # and took a release down with it.
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: matrix.arch != ''
        with:
          name: image-${{ matrix.arch }}
          # The directory, not a glob: with `image/**` the artifact's root
          # becomes image/bin/<arch> and the layout the Dockerfile copies from
          # is lost.
          path: image
          if-no-files-found: error
          # One day, not the 90-day default. This only has to survive until
          # `publish` downloads it later in the same run; the durable copies
          # are the release assets. At the default, this workflow's output
          # from every push sat for three months — the desktop repo's did
          # exactly that until it filled the account's 0.5 GB Actions storage
          # and took a release down with it.
          retention-days: 1

  publish:
    name: publish ${{ needs.meta.outputs.version }}
    needs: [meta, build]
    # A dispatch is a dry run unless it was asked to publish.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Release notes come from crates/changelog, so this job needs a compiler
      # even though it builds nothing else. The crate depends only on serde, so
      # it is seconds once the cache is warm.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: image
          pattern: image-*
          merge-multiple: true

      - name: Checksums
        # Regular files only, and never the sums file itself: `sha256sum ./*`
        # dies on the first directory it meets, which is how a stray folder in
        # an artifact takes the whole release down.
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        # The notes come from the changelog, not from `--generate-notes`: the
        # commit subjects are Turkish and describe the code, which is the wrong
        # text for a download page. This also refuses to publish a version the
        # changelog has never heard of — the release cannot get ahead of its
        # own notes.
        run: |
          cargo run -q -p spacetrace-changelog -- \
            notes --component cli --version "$VERSION" > notes.md
          cat >> notes.md <<EOF

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | SPACETRACE_VERSION=$VERSION sh
          \`\`\`
          EOF
          gh release create "$VERSION" artifacts/* \
            --title "spacetrace $VERSION" \
            --notes-file notes.md

      # The agent's container image, which docs/AGENT.md tells people to pull.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          echo "list=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: image
          file: .github/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
