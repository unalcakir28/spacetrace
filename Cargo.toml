[workspace]
resolver = "2"
members = [
    "crates/scan-core",
    "crates/store",
    "crates/diff",
    "crates/cli",
    "crates/agent",
    "crates/treemap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/unalcakir28/spacetrace"

[workspace.dependencies]
spacetrace-scan-core = { path = "crates/scan-core", version = "0.1.0" }
spacetrace-store = { path = "crates/store", version = "0.1.0" }
spacetrace-diff = { path = "crates/diff", version = "0.1.0" }
spacetrace-treemap = { path = "crates/treemap", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
humansize = "2"
crossbeam-channel = "0.5"
tempfile = "3"

# Agent (phase 2). HTTP+JSON was chosen over gRPC; see docs/DECISIONS.md K3.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
toml = "1"
zstd = "0.14"
# webpki-roots rather than the system trust store: the agent ships as a static
# binary onto NAS boxes whose CA bundle may be absent or years stale.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "blocking"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
