[workspace]
resolver = "2"
members = [
    "crates/scan-core",
    "crates/store",
    "crates/diff",
    "crates/dupes",
    "crates/cli",
    "crates/agent",
    "crates/treemap",
    "crates/changelog",
    "crates/buildinfo",
]

[workspace.package]
version = "0.9.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/unalcakir28/spacetrace"

[workspace.dependencies]
spacetrace-scan-core = { path = "crates/scan-core", version = "0.9.1" }
spacetrace-store = { path = "crates/store", version = "0.9.1" }
spacetrace-diff = { path = "crates/diff", version = "0.9.1" }
spacetrace-dupes = { path = "crates/dupes", version = "0.9.1" }
spacetrace-treemap = { path = "crates/treemap", version = "0.9.1" }
spacetrace-changelog = { path = "crates/changelog", version = "0.9.1" }
spacetrace-buildinfo = { path = "crates/buildinfo", version = "0.9.1" }

# External versions are exact (`=x.y.z`) and live only here; crates take them
# with `foo.workspace = true`. A range lets a fresh lock pick up a release
# nobody read. CI's lint job refuses a range or a crate-local version.
anyhow = "=1.0.104"
rayon = "=1.12.0"
blake3 = "=1.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
clap = { version = "=4.6.6", features = ["derive"] }
humansize = "=2.1.3"
tempfile = "=3.27.0"
# Verifying a download against the published SHA256SUMS. std has no hash,
# and a self-update that installs what it did not check is not an update.
sha2 = "=0.10.9"
# scan-core's syscalls on every Unix. The CLI names it for one thing, the
# signal handler `scan --ssh` needs so Ctrl-C ends in a confirmed remote
# cleanup rather than in a dead process.
libc = "=0.2.189"
# scan-core's Windows metadata: allocation size and file identity per entry.
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
# The host a snapshot is filed under.
gethostname = "=0.5.0"

# `spacetrace watch`, CLI only — never the agent, store or scan-core. A watcher's
# guarantees live in its backends (which events are delivered, how loss is
# flagged) and a minor release may move them, so this pin is read before any
# bump, not just moved. The default
# feature set is exactly `macos_fsevent`, which is the macOS backend itself;
# spelled out so this line says what gets built. Everything optional — the
# crossbeam/flume channels, kqueue, serde — stays off: std's mpsc is the channel.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }

# Agent (phase 2). HTTP+JSON was chosen over gRPC; see docs/DECISIONS.md K3.
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
toml = "=1.1.5"
zstd = "=0.14.0"
# webpki-roots rather than the system trust store: the agent ships as a static
# binary onto NAS boxes whose CA bundle may be absent or years stale.
reqwest = { version = "=0.13.1", default-features = false, features = ["rustls", "webpki-roots", "json", "blocking"] }

# Server-side TLS in the agent (D2). None of these three is a new crate in the
# graph: reqwest already pulls rustls and tokio-rustls, axum already pulls hyper
# and hyper-util. The lines only name them so the accept loop can use them
# directly. Features are exactly the set those crates already enable — in
# particular `logging` stays off — so declaring them adds nothing to the build.
rustls = { version = "=0.23.43", default-features = false, features = ["std", "aws-lc-rs", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["aws-lc-rs", "tls12"] }
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["server", "service", "tokio"] }
# Test-only. The TLS tests need a certificate, and a checked-in one expires and
# breaks CI on a date nobody picked. `aws_lc_rs` rather than rcgen's default
# `ring`: aws-lc-rs is already compiled through rustls and ring is not, so this
# stays free.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
