<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The mark is the product's thesis, not a decoration: a squarified treemap
       in the app's own category palette, with exactly one tile in the warm
       "this grew" colour. Every other disk analyser draws the map; the warm
       tile is the second question this one answers.

       Kept flat and to five tiles on purpose — it has to read at 32px in a
       taskbar, where a gradient is mud and a sixth tile is noise. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2c"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <filter id="heat" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feComposite in="b" in2="SourceAlpha" operator="out"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <rect x="4" y="4" width="504" height="504" rx="109" fill="none"
        stroke="#3a4468" stroke-opacity=".55" stroke-width="2"/>

  <!-- Left column: the two biggest folders. -->
  <rect x="60" y="60" width="232" height="232" rx="10" fill="#45d3ba"/>
  <rect x="60" y="300" width="232" height="152" rx="10" fill="#a98cf0"/>

  <!-- Right column, top: the one that grew. -->
  <g>
    <rect x="300" y="60" width="152" height="142" rx="10" fill="#ffb454" filter="url(#heat)" opacity=".85"/>
    <rect x="300" y="60" width="152" height="142" rx="10" fill="#ffb454"/>
  </g>
  <rect x="300" y="210" width="152" height="92" rx="10" fill="#58b4e8"/>
  <rect x="300" y="310" width="152" height="142" rx="10" fill="#7bd88f"/>
</svg>
